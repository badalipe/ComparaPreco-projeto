plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Login embutido: vem dos "Secrets" do GitHub (nunca fica escrito no código).
def cfEnc = { String s ->
    byte[] key = 'qp-7Kx!'.getBytes('UTF-8')
    byte[] b = s.getBytes('UTF-8')
    byte[] o = new byte[b.length]
    for (int i = 0; i < b.length; i++) { o[i] = (byte) (b[i] ^ key[i % key.length]) }
    return o.encodeBase64().toString()
}
def cfUser = System.getenv('CF_USER') ?: ''
def cfPass = System.getenv('CF_PASS') ?: ''
def appPin = System.getenv('APP_PIN') ?: ''

android {
    namespace 'com.quickprice.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.comparapreco.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0"
        buildConfigField "String", "CF_USER", "\"${cfEnc(cfUser)}\""
        buildConfigField "String", "CF_PASS", "\"${cfEnc(cfPass)}\""
        buildConfigField "String", "APP_PIN", "\"${cfEnc(appPin)}\""
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // CameraX + ML Kit
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'org.jsoup:jsoup:1.18.3'

    // Image loading and database
    implementation 'androidx.sqlite:sqlite:2.2.0'


    testImplementation 'junit:junit:4.13.2'
}
