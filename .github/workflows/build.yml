name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Descompactar o projeto
        run: unzip -o ComparaPreco-projeto.zip
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        env:
          CF_USER: ${{ secrets.CF_USER }}
          CF_PASS: ${{ secrets.CF_PASS }}
          APP_PIN: ${{ secrets.APP_PIN }}
        run: gradle -p ComparaPreco assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ComparaPreco-debug
          path: ComparaPreco/app/build/outputs/apk/debug/*.apk
